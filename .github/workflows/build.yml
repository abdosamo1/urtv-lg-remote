name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        run: base64 -d app/keystore.b64 > app/remote.jks
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Name it
        run: cp app/build/outputs/apk/release/app-release.apk urtv-remote.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ريموت تلفزيونك (آخر نسخة)
          body: "build ${{ github.run_number }}"
          files: urtv-remote.apk
          make_latest: true
